# Active le parallélisme
junit.jupiter.execution.parallel.enabled = true

# Type de configuration (fixe = nombre défini de threads)
junit.jupiter.execution.parallel.config.strategy = fixed

# Nombre maximum de threads en parallèle
junit.jupiter.execution.parallel.config.fixed.parallelism = 2

# Optionnel : définit le mode d'exécution par défaut
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrentjunit.platform.listeners.custom=com.ReportOpenerListener


