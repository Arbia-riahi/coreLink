<!--
  ⚠ Locators utilisés par les tests Selenium (ForgotResetPasswordPage.java) — ne pas modifier :
    - input#email
    - bouton .btn.btn-lg.btn-cta ("Envoyer le lien")
-->
<div class="forgot-password-wrapper auth-page">
  <div class="page-bg" aria-hidden="true"></div>

  <a class="home-btn" [routerLink]="['/home']" aria-label="Revenir à l’accueil">
    <i class="fas fa-home" aria-hidden="true"></i>
    <span>Accueil</span>
  </a>

  <div class="card forgot-card auth-card">
    <div class="text-center mb-4">
      <span class="icon-badge" aria-hidden="true"><i class="bi bi-envelope-paper-fill"></i></span>
      <h4 class="fw-bold mb-2">Mot de passe oublié ?</h4>
      <p class="text-secondary mb-0">
        Pas d'inquiétude ! Entrez votre adresse email et nous vous enverrons un lien de réinitialisation.
      </p>
    </div>

    <form (ngSubmit)="onForgotPassword()" class="needs-validation" novalidate>
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Adresse email</label>
        <div class="input-wrap">
          <i class="bi bi-envelope-fill input-icon" aria-hidden="true"></i>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            class="form-control"
            placeholder="exemple@email.com"
            required
            autocomplete="email"
            aria-describedby="emailHelp"
          />
        </div>
        <div id="emailHelp" class="form-text mt-2">
          <i class="bi bi-shield-check" aria-hidden="true"></i> Nous ne partagerons jamais votre email.
        </div>
        <div class="invalid-feedback">Adresse email obligatoire.</div>
      </div>

      <!-- Boutons -->
      <div class="d-grid gap-3">
        <button type="submit" class="btn btn-lg btn-cta btn-main">
          <i class="bi bi-send-check-fill me-1"></i> Envoyer le lien
        </button>

        <button
          type="button"
          class="btn btn-lg btn-ghost btn-soft"
          [routerLink]="['/home/login']"
        >
          <i class="bi bi-arrow-left me-1"></i> Retour à la connexion
        </button>
      </div>
    </form>

    <!-- Message -->
    <div *ngIf="message" class="alert alert-info mt-4 text-center" role="status" aria-live="polite">
      {{ message }}
    </div>

    <ol class="steps list-unstyled" aria-label="Étapes">
      <li class="active"><span>1</span> Email</li>
      <li><span>2</span> Lien reçu</li>
      <li><span>3</span> Nouveau mot de passe</li>
    </ol>
  </div>
</div>
