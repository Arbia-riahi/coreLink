<div class="container-fluid">
  <div class="card shadow-lg border-0 rounded-3 my-4 custom-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="h4 text-warning fw-bold" style="font-size:30px">Modifier un Projet</h1>
        <p class="text-muted" style="font-size:18px">Mettez à jour les informations du projet ci-dessous.</p>
      </div>

      <form #formProjet="ngForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" autocomplete="off">

        <!-- Titre -->
        <div class="mb-3">
          <label for="titre" class="form-label">Titre :</label>
          <input type="text"
                 id="titre"
                 name="titre"
                 [(ngModel)]="project.titre"
                 (ngModelChange)="onAnyFieldChanged()"
                 #titre="ngModel"
                 class="form-control shadow-sm"
                 placeholder="Entrez le titre du projet"
                 />
          
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label for="description" class="form-label">Description :</label>
          <textarea id="description"
                    name="description"
                    [(ngModel)]="project.description"
                    (ngModelChange)="onAnyFieldChanged()"
                    #description="ngModel"
                    class="form-control shadow-sm"
                    placeholder="Décrivez le projet"
                    rows="4"
                    ></textarea>
          
        </div>

        <!-- Dates -->
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="dateDebut" class="form-label">Date début :</label>
            <input type="date"
                   id="dateDebut"
                   name="dateDebut"
                   [(ngModel)]="project.dateDebut"
                   (ngModelChange)="onDateChanged()"
                   #dateDebut="ngModel"
                   class="form-control shadow-sm" />
            <div *ngIf="dateErrorDebut" class="form-text text-danger mt-2">{{ dateErrorDebut }}</div>
          </div>
          <div class="col-md-6">
            <label for="dateFin" class="form-label">Date fin :</label>
            <input type="date"
                   id="dateFin"
                   name="dateFin"
                   [(ngModel)]="project.dateFin"
                   (ngModelChange)="onDateChanged()"
                   #dateFin="ngModel"
                   class="form-control shadow-sm" />
            <div *ngIf="dateErrorFin" class="form-text text-danger mt-1">{{ dateErrorFin }}</div>
          </div>
        </div>

        <!-- Statut -->
        <!-- Statut -->
<div class="form-group mb-3">
  <label class="form-label fw-semibold">
    Statut <span class="text-danger">*</span>
  </label>

  <div class="status-options d-flex gap-2 flex-wrap">
    <button
      *ngFor="let s of statuses"
      type="button"
      class="badge px-3 py-2 status-chip"
      [class.active-chip]="project.status === s.value"
      [ngClass]="getChipClass(s.value)"
      (click)="selectStatus(s.value)"
    >
      {{ s.label }}
    </button>
  </div>
</div>


        <!-- Membres -->
        <div class="mb-3">
          <label for="membres" class="form-label">Membres :</label>
          <div class="border rounded p-2 shadow-sm bg-light">
            <div *ngFor="let m of membersList" class="form-check">
              <input class="form-check-input"
                     type="checkbox"
                     [value]="m.matricule"
                     (change)="onMemberChecked($event, m.matricule)"
                     [checked]="project.membres.includes(m.matricule)" />
              <label class="form-check-label">{{ m.nom }} {{ m.prenom }}</label>
            </div>
          </div>
        </div>

        <!-- Fichiers existants -->
      
<div class="mb-3" *ngIf="project.fichiers?.length">
  <label class="form-label">Fichiers existants :</label>
  <ul class="list-group list-group-flush">
    <li *ngFor="let file of project.fichiers; let i = index"
        class="list-group-item d-flex justify-content-between align-items-center">
      <span>{{ getPrettyFileName(file) }}</span>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="removeExistingFile(i)">
        <i class="fas fa-times"></i>
      </button>
    </li>
  </ul>
</div>


        <!-- Ajout de nouveaux fichiers -->
        <div class="mb-3">
          <div class="upload-dropzone shadow-sm p-3 rounded mb-2"
               (click)="openFileDialog()"
               (dragover)="onDragOver($event)"
               (dragleave)="onDragLeave($event)"
               (drop)="onDrop($event)">
            <p class="mb-0 text-muted" *ngIf="selectedFiles.length === 0">
              Glissez vos fichiers ici ou cliquez pour les sélectionner
            </p>
            <ul *ngIf="selectedFiles.length > 0" class="list-unstyled selected-files">
              <li *ngFor="let file of selectedFiles; let i = index" class="file-item d-flex justify-content-between align-items-center">
                <span>{{ file.name }}</span>
                <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeFile(i, $event)">
                  <i class="fas fa-times"></i>
                </button>
              </li>
            </ul>
            <input type="file" #fileInput multiple (change)="onFilesChanged($event)" class="hidden-input" />
          </div>
          <div *ngIf="fileError" class="form-text text-danger">{{ fileError }}</div>
        </div>

        <!-- Bouton -->
        <button type="submit"
                class="btn btn-warning w-100 shadow-sm"
                [disabled]="formProjet.form.invalid || fileError || dateErrorFin || dateErrorDebut || !isModified">
          <i class="fas fa-save"></i> Modifier Projet
        </button>

      </form>
    </div>
  </div>
</div>
