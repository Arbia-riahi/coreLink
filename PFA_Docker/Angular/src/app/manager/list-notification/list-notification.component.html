<div class="notifications-container">
  <h2>Notifications</h2>
  <button (click)="markAllAsRead()">Tout marquer comme lu</button>

  <ul>
    <li *ngFor="let notif of notifications" [class.unread]="!notif.lue">
      <span>{{ notif.message }}</span>
      <small>{{ notif.date | date:'short' }}</small>
      <div class="actions">
        <button *ngIf="!notif.lue" (click)="markAsRead(notif.id)">Marquer comme lu</button>
        <button (click)="deleteNotification(notif.id)">Supprimer</button>
      </div>
    </li>
  </ul>
</div>
