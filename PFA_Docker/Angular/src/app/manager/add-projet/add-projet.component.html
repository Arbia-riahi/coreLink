<div class="container-fluid py-5 form-wrapper">
  <h1 class="h3 mb-4 text-primary fw-bold text-center" style="font-size:35px">
    Créer un nouveau projet
  </h1>

  <div class="card shadow-lg border border-primary rounded-3 form-card">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h2 class="h4 text-dark fw-semibold" style="font-size:18px">Création d’un projet</h2>
        <p class="text-muted" style="font-size:15px">Veuillez remplir les informations ci-dessous</p>
      </div>

      <form #formProjet="ngForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" autocomplete="off">

        <!-- Titre -->
        <div class="form-group mb-3">
          <label for="titre" class="form-label fw-semibold">
            Titre <span class="text-danger">*</span>
          </label>
          <input
            type="text"
            id="titre"
            name="titre"
            [(ngModel)]="project.titre"
            #titre="ngModel"
            class="form-control shadow-sm"
            placeholder="Entrez le titre du projet"
            required
          />
          <div *ngIf="titre.invalid && (titre.dirty || titre.touched)" class="text-danger small mt-1">
            
          </div>
        </div>

        <!-- Description -->
        <div class="form-group mb-3">
          <label for="description" class="form-label fw-semibold">
            Description <span class="text-danger">*</span>
          </label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="project.description"
            #description="ngModel"
            class="form-control shadow-sm"
            rows="3"
            placeholder="Décrivez le projet"
            required
          ></textarea>
          <div *ngIf="description.invalid && (description.dirty || description.touched)" class="text-danger small mt-1">
          
          </div>
        </div>

        <div class="row">
          <!-- Date début -->
          <div class="col-md-6 mb-3">
            <label for="dateDebut" class="form-label fw-semibold">
              Date début <span class="text-danger">*</span>
            </label>
            <input
              type="date"
              id="dateDebut"
              name="dateDebut"
              [(ngModel)]="project.dateDebut"
              #dateDebut="ngModel"
              class="form-control shadow-sm"
              [min]="today"
              required
              (ngModelChange)="validateDates()"
              (change)="validateDates()"
            />

            <!-- Erreur "début < aujourd’hui" -->
            <div *ngIf="dateDebutError" class="text-danger small mt-1">
              {{ dateDebutError }}
            </div>

            <!-- Erreur native min (selon navigateur) -->
            <div *ngIf="dateDebut?.errors?.['min'] && (dateDebut.touched || dateDebut.dirty)"
                 class="text-danger small mt-1">
              La date de début doit être aujourd’hui ou plus tard
            </div>

            <!-- Erreur required -->
            <div *ngIf="dateDebut?.errors?.['required'] && (dateDebut.touched || dateDebut.dirty)"
                 class="text-danger small mt-1">
            
            </div>
          </div>

          <!-- Date fin -->
          <div class="col-md-6 mb-3">
            <label for="dateFin" class="form-label fw-semibold">
              Date fin <span class="text-danger">*</span>
            </label>
            <input
              type="date"
              id="dateFin"
              name="dateFin"
              [(ngModel)]="project.dateFin"
              #dateFin="ngModel"
              class="form-control shadow-sm"
              [min]="project.dateDebut || today"
              required
              (ngModelChange)="validateDates()"
              (change)="validateDates()"
            />

            <!-- Erreur "fin < début" -->
            <div *ngIf="dateError" class="text-danger small mt-1">
              {{ dateError }}
            </div>

            <!-- Erreurs natives -->
            <div *ngIf="dateFin?.errors?.['required'] && (dateFin.touched || dateFin.dirty)"
                 class="text-danger small mt-1">
              
            </div>
          </div>
        </div>

        <!-- Statut -->
        <div class="form-group mb-3">
          <label class="form-label fw-semibold">
            Statut <span class="text-danger">*</span>
          </label>
          <div class="status-options d-flex gap-2 flex-wrap">
            <button
              *ngFor="let s of statuses"
              type="button"
              class="badge px-3 py-2 status-chip"
              [class.active-chip]="project.status === s.value"
              [ngClass]="getChipClass(s.value)"
              (click)="selectStatus(s.value)"
            >
              {{ s.label }}
            </button>
          </div>

          <!-- Champ caché pour inclure 'status' dans le ngForm -->
          <input type="hidden" name="status" [ngModel]="project.status" required #statusCtrl="ngModel" />
          <div *ngIf="statusCtrl.invalid && (statusCtrl.touched || statusCtrl.dirty)" class="text-danger small mt-1">
           
          </div>
        </div>

        <!-- Membres -->
        <div class="form-group mb-3">
          <label for="membres" class="form-label fw-semibold">
            Membres <span class="text-danger">*</span>
          </label>

          <div *ngFor="let m of membersList" class="mb-1">
            <input
              type="checkbox"
              [value]="m.matricule"
              (change)="onMemberChecked($event, m.matricule)"
              [checked]="project.membres.includes(m.matricule)"
              id="m-{{m.matricule}}"
            />
            <label [for]="'m-' + m.matricule">{{ m.nom }} {{ m.prenom }}</label>
          </div>

          <!-- Champ caché pour forcer la validation (au moins un membre) -->
          <input
            type="hidden"
            name="membresRequired"
            [ngModel]="project.membres.length > 0 ? 'ok' : ''"
            required
            #membresCtrl="ngModel"
          />
         
        </div>

        <!-- Zone fichiers (facultatif) -->
        <div class="form-group mb-3">
          <div
            class="upload-dropzone shadow-sm mb-3"
            (click)="openFileDialog()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)"
          >
            <p *ngIf="selectedFiles.length === 0">Glissez vos fichiers ici ou cliquez pour les sélectionner</p>
            <ul *ngIf="selectedFiles.length > 0" class="list-unstyled selected-files">
              <li *ngFor="let file of selectedFiles; let i = index" class="file-item d-flex justify-content-between align-items-center">
                <span>{{ file.name }}</span>
                <button
                  type="button"
                  class="file-remove-btn btn btn-sm btn-outline-danger"
                  (click)="removeFile(i, $event)"
                >
                  <i class="fas fa-times"></i>
                </button>
              </li>
            </ul>
            <input type="file" #fileInput multiple (change)="onFilesChanged($event)" class="hidden-input" />
          </div>
          <div *ngIf="fileError" class="text-danger small">{{ fileError }}</div>
        </div>

        <!-- Bouton -->
        <div class="d-grid mt-4">
          <button
            type="submit"
            class="btn btn-primary btn-lg shadow-sm"
            [disabled]="!canSubmit(formProjet)"
          >
            Créer Projet
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
