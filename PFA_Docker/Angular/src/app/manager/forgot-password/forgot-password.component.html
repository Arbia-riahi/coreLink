<div class="forgot-password-wrapper d-flex justify-content-center align-items-center vh-100">
  <div class="card forgot-card shadow-lg p-4" style="max-width: 400px; border-radius: 12px;">
    
    <div class="text-center mb-4">
      <i class="bi bi-envelope-lock icon-lock" style="font-size: 2.5rem; color: #ffc107;"></i>
      <h4 class="mt-2 fw-bold text-dark">Mot de passe oublié</h4>
      <p class="text-muted small">Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
    </div>

    <form (ngSubmit)="onForgotPassword()" class="needs-validation">
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="form-label fw-semibold">Adresse email</label>
        <div class="input-group">
          <span class="input-group-text bg-warning text-white">
            <i class="bi bi-envelope-fill"></i>
          </span>
          <input type="email" id="email" [(ngModel)]="email" name="email" 
                 class="form-control" placeholder="exemple@email.com" required>
        </div>
      </div>

      <!-- Boutons -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-warning rounded-pill">
          <i class="bi bi-send-check-fill"></i> Envoyer le lien
        </button>

        <!-- Bouton Annuler -->
        <button type="button" class="btn btn-outline-secondary rounded-pill"
               [routerLink]="['/manager/updatePassword']" >
          <i class="bi bi-arrow-left-circle"></i> Annuler
        </button>
      </div>
    </form>

    <!-- Message -->
    <div *ngIf="message" class="alert alert-info mt-3 text-center">
      {{ message }}
    </div>
  </div>
</div>
