<div class="reset-password-wrapper d-flex justify-content-center align-items-center vh-100">
  <div class="card reset-card shadow-lg p-4">
    
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill icon-lock"></i>
      <h4 class="mt-2 fw-bold text-dark">Réinitialiser le mot de passe</h4>
      <p class="text-muted small">Veuillez entrer un nouveau mot de passe sécurisé.</p>
    </div>

    <form (ngSubmit)="onResetPassword()" class="needs-validation">
      <!-- Nouveau mot de passe -->
      <div class="mb-3">
        <label for="newPassword" class="form-label fw-semibold">Nouveau mot de passe</label>
        <div class="input-group">
          <span class="input-group-text icon-bg">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" 
                 class="form-control" placeholder="********" required>
        </div>
      </div>

      <!-- Confirmer mot de passe -->
      <div class="mb-4">
        <label for="confirmPassword" class="form-label fw-semibold">Confirmer le mot de passe</label>
        <div class="input-group">
          <span class="input-group-text icon-bg">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" 
                 class="form-control" placeholder="********" required>
        </div>
      </div>

      <!-- Bouton -->
      <button type="submit" class="btn btn-gradient w-100 rounded-pill">
        <i class="bi bi-check-circle-fill"></i> Réinitialiser
      </button>
    </form>

    <!-- Message -->
    <div *ngIf="message" class="alert alert-info mt-3 text-center">
      {{ message }}
    </div>
  </div>
</div>
