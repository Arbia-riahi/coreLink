<section class="actualites-page container-lg py-4 py-md-5">
  <div class="page-header text-center mb-1">
    <div>
      <h1 class="h3 mb-1">Créer une nouvelle actualité</h1>
      <p class="text-muted mb-0">Veuillez remplir les informations ci-dessous</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <form
        #data="ngForm"
        (ngSubmit)="persistActualite(data)"
        class="user"
        enctype="multipart/form-data"
        novalidate
      >
        <div class="row g-4">
          <!-- Titre -->
          <div class="col-12">
            <label for="titre" class="form-label mb-1 fw-600">
              Titre <span class="text-danger">*</span>
            </label>
            <div class="input-icon">
              <input
                id="titre"
                type="text"
                name="titre"
                ngModel
                class="form-control form-control-lg"
                placeholder="Saisir le titre de l’actualité"
                required
                autocomplete="off"
                aria-describedby="titreHelp"
              />
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
              </svg>
            </div>
            <small id="titreHelp" class="form-text text-muted">Ex. “Mise à jour de la plateforme”.</small>
          </div>

          <!-- Description -->
          <div class="col-12">
            <label for="description" class="form-label mb-1 fw-600">
              Description <span class="text-danger">*</span>
            </label>
            <input
              id="description"
              type="text"
              name="description"
              ngModel
              class="form-control form-control-lg"
              placeholder="Brève description de l’actualité"
              required
              autocomplete="off"
            />
          </div>

          <!-- Photos -->
          <div class="col-12">
            <label for="photos" class="form-label mb-1 fw-600">
              Photos <span class="text-danger">*</span>
            </label>
            <input
              id="photos"
              type="file"
              (change)="onFileChange($event)"
              accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
              multiple
              class="form-control form-control-lg"
              required
              aria-describedby="photosHelp"
            />
            <small id="photosHelp" class="form-text text-muted">
              PNG, JPG, GIF ou WebP — fichiers multiples autorisés.
            </small>
          </div>

          <!-- Bouton -->
          <div class="col-12">
            <button
              type="submit"
              class="btn btn-primary btn-lg px-4 w-100 w-md-auto"
              [disabled]="!isReadyToCreate(data) || isSubmitting"
            >
              <span *ngIf="!isSubmitting">Créer l’actualité</span>
              
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
