<div class="container my-5">
  <h2 class="text-center text-primary fw-bold mb-4">
    <i class="fas fa-user-edit me-2"></i>Modifier l'utilisateur
  </h2>

  <div class="card border-box-style shadow-sm">
    <div class="card-body p-4">
      <h3 class="text-center mb-3 text-secondary">
        <i class="fas fa-pen me-2"></i>Mise à jour des informations
      </h3>

      <form #formUser="ngForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" autocomplete="off">
        
        <div class="row g-3">
          <!-- Matricule (lecture seule) -->
          <div class="col-md-6">
            <label class="form-label">Matricule :</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-id-card"></i></span>
              <input type="text" class="form-control" name="matricule" [(ngModel)]="user.matricule" required readonly />
            </div>
          </div>

          <!-- Nom -->
          <div class="col-md-6">
            <label class="form-label">Nom :</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" name="nom" [(ngModel)]="user.nom" required />
            </div>
          </div>

          <!-- Prénom -->
          <div class="col-md-6">
            <label class="form-label">Prénom :</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" class="form-control" name="prenom" [(ngModel)]="user.prenom" required />
            </div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label">Email :</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope"></i></span>
              <input type="email" class="form-control" name="email" [(ngModel)]="user.email" required />
            </div>
          </div>

          <!-- Rôle -->
          <div class="col-md-6">
            <label class="form-label">Rôle :</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
              <select class="form-control" name="role" [(ngModel)]="user.role" required>
                <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Image actuelle -->
       
<div class="mt-4">
  <label class="form-label"><i class="fas fa-image me-2"></i>Image actuelle :</label><br>

  <img 
    [src]="getUserPhoto(user.image)"
    (error)="onImageError($event)"
    alt="Image actuelle"
    class="img-thumbnail rounded-circle"
    style="width:110px; height:110px; border:2px solid #ddd; object-fit:cover;">
</div>


        <!-- Nouvelle image -->
        <div class="mt-3">
          <label class="form-label"><i class="fas fa-upload me-2"></i>Nouvelle image :</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-file-image"></i></span>
            <input type="file" class="form-control" (change)="onFileChanged($event)" accept="image/*" />
          </div>
          <div *ngIf="previewImageUrl" class="mt-3">
            <label class="form-label">Aperçu :</label><br>
            <img [src]="previewImageUrl" alt="Aperçu image"
                 class="img-thumbnail rounded-circle"
                 style="width:110px; height:110px; border: 2px solid #ddd;">
          </div>
        </div>

        <!-- Boutons -->
        <div class="d-flex justify-content-center mt-4 gap-3">
          <button type="submit" class="btn btn-warning px-4" [disabled]="!formUser.form.valid">
            <i class="fas fa-save me-2"></i>Mettre à jour
          </button>
          <button type="button" class="btn btn-secondary px-4" (click)="revenirALaListe()">
            <i class="fas fa-arrow-left me-2"></i>Revenir à la liste
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
