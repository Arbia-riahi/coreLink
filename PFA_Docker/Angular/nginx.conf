server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 👉 Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 👉 Redirection API vers Spring Boot
    location /api/ {
         proxy_pass http://backend_container:8080;   # ⭐ changer ici
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    
location ^~ /uploads/ {
    proxy_pass http://backend_container:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Empêche nginx de tenter d'accéder à un fichier local
    disable_symlinks off;
}




    # 👉 Cache statique
    location ~* \.(?:css|js|json|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 👉 Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 👉 Sécurité
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    # 👉 Angular fallback
    error_page 404 /index.html;
}




