<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Administrator Profile</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 p-4 bg-white border rounded shadow">
  <div class="row">

    <!-- Section gauche -->
    <div class="col-md-4">
      <div class="card text-center border">
        <div class="card-body">
          <!-- Image statique -->
          <img 
            src="assets/backoffice/img/undraw_profile_3.svg" 
            alt="System Administrator" 
            class="rounded-circle mb-3 border" 
            style="width: 120px; height: 120px;">
          <h5 class="card-title">Systeme Administrateur</h5>
          <p class="text-muted">Admin GestiBanque</p>
          <p><strong>Email:</strong> adminmail.com</p>
          
        </div>
      </div>
    </div>

    <!-- Section droite -->
    <div class="col-md-8">
      <h4 class="mb-4">Profile</h4>
      
      <!-- Onglets -->
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
          <a class="nav-link active" href="#">changer mon Profile</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Change mot de passe</a>
        </li>
      </ul>

      <!-- Formulaire -->
      <form>

         <!-- Champ username -->
         <div class="mb-3">
            <label for="name" class="form-label">Nom d'utilisateur</label>
            <input 
              type="text" 
              class="form-control" 
            
              value="System Administrator">
          </div>
        <!-- Champ Nom -->
        <div class="mb-3">
          <label for="name" class="form-label">Nom</label>
          <input 
            type="text" 
            class="form-control" 
           
            value="System Administrator">
        </div>

         <!-- Champ prenom-->
         <div class="mb-3">
            <label for="name" class="form-label">prenom</label>
            <input 
              type="text" 
              class="form-control" 
              
              value="System Administrator">
          </div>

        <!-- Champ Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            class="form-control" 
          
            value="admin@mail.com">
        </div>

         <!-- Champ password -->
         <div class="mb-3">
            <label for="email" class="form-label">télephone </label>
            <input 
              type="text" 
              class="form-control" 
              
              value="admin@mail.com">
          </div>
        

        <!-- Bouton Mettre à jour -->
        <button type="submit" class="btn btn-primary">Update Account</button>
      </form>
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
