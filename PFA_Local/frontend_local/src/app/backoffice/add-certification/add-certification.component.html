<div class="container-fluid">
  <h1 class="h3 mb-2 text-gray-800">Gestion des Certifications</h1>
  <p>Créer ou mettre à jour une certification.</p>
  <div class="card o-hidden border-0 shadow-lg my-12">
    <div class="card-body p-0">
      <div class="row">
        <div class="col-lg-12">
          <div class="p-5">
            <div class="text-center">
              <h1 class="h4 text-gray-900 mb-12">{{ isUpdate ? 'Mettre à jour la certification' : 'Créer une certification' }}</h1>
            </div>
            <form #data="ngForm" (ngSubmit)="persistCertification()" class="user" enctype="multipart/form-data">
              <div class="form-group row">
                <div class="col-12">
                  Nom :
                  <input type="text" [(ngModel)]="certification.nom" name="nom" class="form-control form-control-user" placeholder="Nom certification" required />
                </div>
                <div class="col-12">
                  Description :
                  <input type="text" [(ngModel)]="certification.description" name="description" class="form-control form-control-user" placeholder="Description certification" required />
                </div>
              </div>
              <div class="form-group row">
                <div class="col-12">
                  Logo :
                  <input type="file" (change)="onFileChange($event)" accept="image/*" class="form-control form-control-user" [required]="!isUpdate" />
                </div>
              </div>
              <input type="submit" class="btn btn-primary btn-user btn-block" [value]="isUpdate ? 'Mettre à jour' : 'Créer'" />
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
