<div class="container my-5">
  <h1 class="h3 mb-4 text-primary font-weight-bold">Gestion des catégories</h1>

  <button class="btn btn-success mb-3" (click)="addCategory()">Ajouter une catégorie</button>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col">Nom</th>
              <th scope="col">Date de création</th>
              <th scope="col">Date de modification</th>
              <th scope="col" class="text-center">Options</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="categories.length === 0">
              <td colspan="4" class="text-center">Aucune catégorie trouvée.</td>
            </tr>
            <tr *ngFor="let c of categories">
              <td>{{ c.nom }}</td>
              <td>{{ c.dateCreation | date: 'dd/MM/yyyy HH:mm' }}</td>
              <td>{{ c.dateModification ? (c.dateModification | date: 'dd/MM/yyyy HH:mm') : 'Non modifié' }}</td>
              <td class="text-center">
                <div class="btn-group">
                  <a [routerLink]="['/backoffice/updateCategory', c.id]" class="btn btn-outline-warning btn-sm">
                    <i class="fas fa-edit"></i>
                  </a>
                  <button class="btn btn-outline-danger btn-sm" (click)="deleteCategory(c.id)">
                    <i class="fas fa-trash"></i> 
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
          
        </table>
      </div>
    </div>
  </div>
</div>
