<div class="container-fluid">
  <h1 class="h3 mb-2 text-gray-800">Mise à jour d'une Certification</h1>

  <div class="card o-hidden border-0 shadow-lg my-12">
    <div class="card-body p-0">
      <div class="row">
        <div class="col-lg-12">
          <div class="p-5">
            <div class="text-center">
              <h1 class="h4 text-gray-900 mb-12">Modifier la certification</h1>
            </div>

          

            <form *ngIf="certification.nom" (ngSubmit)="updateCertification()" class="user" enctype="multipart/form-data">
              
              <div class="form-group">
                <label>Nom :</label>
                <input type="text" [(ngModel)]="certification.nom" name="nom" class="form-control" required />
              </div>

              <div class="form-group">
                <label>Description :</label>
                <textarea [(ngModel)]="certification.description" name="description" class="form-control" required></textarea>
              </div>

             

              <!-- Affichage logo actuel -->
              <div class="form-group">
                <label>Logo actuel :</label>
                <div class="photo-container mb-2">
                  <img *ngIf="certification.logo && !imageError"
                       [src]="getLogoUrl(certification.logo)"
                       (error)="handleImageError()"
                       alt="Logo actuel"
                       class="photo-circle"
                       width="100"
                       height="100">
                  <p *ngIf="imageError" class="text-danger">Image introuvable sur le serveur.</p>
                </div>
                <input type="file" (change)="onFileChange($event)" accept="image/*" class="form-control" />
              </div>

              <button type="submit" class="btn btn-primary btn-user btn-block">
                Mettre à jour
              </button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
