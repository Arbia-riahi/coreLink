<div class="container-fluid">
  <h1 class="h3 mb-2 text-gray-800">Créer une catégorie</h1>
  
  <div class="card o-hidden border-0 shadow-lg my-4">
    <div class="card-body p-4">
      <div class="text-center">
        <h1 class="h4 text-gray-900 mb-4">Créer une nouvelle catégorie</h1>
      </div>
      <form #data="ngForm" (ngSubmit)="addCategory()" class="user">
        <div class="form-group">
          <label for="nom">Nom de la catégorie :</label>
          <input type="text" [(ngModel)]="category.nom" name="nom" class="form-control"
                 placeholder="Nom de la catégorie" required />
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!category.nom || !category.nom.trim()">
          Créer Catégorie
        </button>
      </form>
    </div>
  </div>
</div>
