<div class="page-header d-flex align-items-center justify-content-between mb-4">
  <div class="d-flex align-items-center gap-2">
   <h1 class="h4 mb-0">Gestion des Actualités</h1>
  </div>
  <button class="btn btn-primary btn-add" [routerLink]="['/backoffice/addActualite']">
    <i class="fas fa-plus me-2" aria-hidden="true"></i> Ajouter
  </button>
</div>

<div class="card card-elevated">
  <div class="card-header d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <span class="badge badge-soft">Liste</span>
      <span class="muted">Dernières mises à jour</span>
    </div>
    <!-- slot si tu veux des filtres plus tard -->
  </div>

  <div class="card-body p-0">
    <div class="table-responsive horizontal-scroll">
      <table class="table table-modern table-modern--nowrap align-middle" id="dataTable" width="100%" cellspacing="0">
        <thead>
          <tr>
            <th class="col-title">Titre</th>
            <th class="col-desc">Description</th>
            <th class="col-date">Date de création</th>
            <th class="col-photos">Photos</th>
            <th class="col-actions text-end pe-4">Options</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let actualite of actualites" class="row-hover">
            <td class="fw-semibold text-truncate-cell">
              {{ actualite.titre }}
            </td>

            <td class="desc-cell">
              {{ actualite.description }}
            </td>

            <td>
              <span class="date-pill">
                {{ actualite.dateCreation | date:'dd/MM/yyyy' }}
              </span>
            </td>

            <td>
              <div class="photo-list" aria-label="Photos de l'actualité">
                <img *ngFor="let img of actualite.photos | slice:0:3"
                     [src]="getPhotoUrl(getImageName(img))"
                     alt="Photo actualité"
                     class="photo-circle"
                     loading="lazy" />

                <button
                  *ngIf="((actualite.photos?.length ?? 0) > 3) && !isExpanded(actualite.id)"
                  type="button"
                  class="photo-more"
                  (click)="toggleExpand(actualite.id)">
                  +{{ (actualite.photos?.length ?? 0) - 3 }}
                </button>
              </div>

              <div class="photo-extra" *ngIf="isExpanded(actualite.id)">
                <img *ngFor="let img of actualite.photos | slice:3"
                     [src]="getPhotoUrl(getImageName(img))"
                     alt="Photo actualité (supplémentaire)"
                     class="photo-circle"
                     loading="lazy" />
                <button type="button" class="btn btn-link btn-sm p-0 ms-2"
                        (click)="toggleExpand(actualite.id)">
                  Afficher moins
                </button>
              </div>
            </td>

            <td class="text-end pe-4">
              <div class="btn-group btn-group-sm" role="group" aria-label="Options">
                <button class="btn btn-soft-warning btn-icon"
                        [routerLink]="['/backoffice/updateActualite', actualite.id]"
                        title="Modifier">
                  <i class="fas fa-edit" aria-hidden="true"></i>
                </button>
                <button class="btn btn-soft-danger btn-icon ms-2"
                        (click)="deleteActu(actualite)"
                        title="Supprimer">
                  <i class="fas fa-trash-alt" aria-hidden="true"></i>
                </button>
              </div>
            </td>
          </tr>

          <tr *ngIf="!actualites || actualites.length === 0">
            <td colspan="5" class="text-center text-muted py-5 empty-state">
              <i class="far fa-newspaper fa-2x d-block mb-2" aria-hidden="true"></i>
              Aucune actualité pour le moment.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card-footer d-flex justify-content-between align-items-center">
    <button class="btn btn-primary" style="padding:5px" (click)="prevPage()" [disabled]="currentPage === 0">
      Précédent
    </button>

    <span class="muted">Page {{ currentPage + 1 }} / {{ totalPages }}</span>

    <button class="btn btn-primary" style="padding:5px"  (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">
      Suivant
    </button>
  </div>
</div>
