<div class="comment-section">
  <!-- Liste des commentaires -->
  <div class="comments-list">
    <h3>Comments</h3>
    <div *ngFor="let comment of commentaires" class="comment-item">
      <img 
        [src]="comment.auteurImage || 'assets/default-avatar.png'" 
        alt="{{ comment.auteurNom }}" 
        class="comment-avatar"
      />
      <div class="comment-content">
        <p class="comment-author">{{ comment.auteurNom }} {{ comment.auteurPrenom }}</p>

        <!-- Si ce commentaire est en cours d'édition -->
        <div *ngIf="editingCommentId === comment.id; else displayMode">
          <textarea [(ngModel)]="editContent" class="edit-textarea"></textarea>
          <button class="save-btn" (click)="saveEdit(comment.id)">Save</button>
          <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
        </div>
        <ng-template #displayMode>
          <p class="comment-text">{{ comment.contenu }}</p>
        </ng-template>

        <div class="comment-actions">
          <small>{{ comment.date | date: 'short' }}</small>
          <span class="action-btn">Like</span>
          <span class="action-btn">Reply</span>
          <!-- Afficher "Modifier" si l'auteur est l'utilisateur connecté -->
          <span class="action-btn" *ngIf="comment.auteurNom === currentUserName" (click)="startEdit(comment)">
            Modifier
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
