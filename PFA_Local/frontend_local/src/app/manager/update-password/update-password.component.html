<div class="update-password-container d-flex justify-content-center align-items-center">
  <div class="card update-password-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <h3 class="text-center mb-4 title">
        <i class="fas fa-user-lock"></i> Mise à jour du mot de passe
      </h3>

      <!-- Formulaire -->
      <form (ngSubmit)="onChangePassword()" class="needs-validation">
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" id="oldPassword" [(ngModel)]="oldPassword" name="oldPassword"
                 class="form-control" placeholder="Ancien mot de passe" required>
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-key"></i></span>
          <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword"
                 class="form-control" placeholder="Nouveau mot de passe" required>
        </div>

        <div class="input-group mb-4">
          <span class="input-group-text"><i class="fas fa-check"></i></span>
          <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
                 class="form-control" placeholder="Confirmer le mot de passe" required>
        </div>

        <!-- Boutons -->
        <button type="submit" class="btn btn-gradient w-100 py-2 rounded-pill">
          <i class="fas fa-sync-alt"></i> Mettre à jour
        </button>

        <button *ngIf="!isFirstLogin" type="button" class="btn btn-outline-secondary w-100 mt-2 rounded-pill"
                (click)="onCancel()">
          <i class="fas fa-times"></i> Annuler
        </button>
      </form>

     

      <div *ngIf="message" class="alert alert-info text-center mt-3">{{ message }}</div>
    </div>
  </div>
</div>
