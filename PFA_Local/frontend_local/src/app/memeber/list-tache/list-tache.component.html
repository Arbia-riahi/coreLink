<div class="card shadow mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0 text-primary" style="font-size:20px">
      Gestion des Tâches - 
      <span *ngIf="projetStatus" [class]="getProjetStatusClass(projetStatus)">
        {{ projetStatus }}
      </span>
    </h5>
    <div>
   
    </div>
  </div>

  <div class="card-body">
    <!-- Filtres -->
    <div class="d-flex mb-3">
      <!-- Filtre État -->
      <div class="me-3">
        <label for="filterEtat" class="form-label">Filtrer par État</label>
        <select id="filterEtat" class="form-select form-select-sm"
                [(ngModel)]="selectedEtat" (change)="applyFilters()">
          <option value="">Tous</option>
          <option *ngFor="let etat of etats" [value]="etat">{{ etat }}</option>
        </select>
      </div>

      <!-- Filtre Priorité -->
      <div class="me-3">
        <label for="filterPriorite" class="form-label">Filtrer par Priorité</label>
        <select id="filterPriorite" class="form-select form-select-sm"
                [(ngModel)]="selectedPriorite" (change)="applyFilters()">
          <option value="">Toutes</option>
          <option *ngFor="let pr of priorites" [value]="pr">{{ pr }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="loading" class="text-center">
      <div class="spinner-border text-primary"></div>
    </div>

   



  <!-- VUE KANBAN -->
<div *ngIf="!loading && viewMode === 'kanban'" class="kanban-board" cdkDropListGroup>

  <!-- COLONNES PAR ÉTAT -->
  <div class="kanban-column"
       *ngFor="let etat of etats"
       cdkDropList
       [cdkDropListData]="groupedTaches[etat]"
       (cdkDropListDropped)="drop($event, etat)">

    <!-- EN-TÊTE DE COLONNE -->
    <div class="kanban-column-header" [ngClass]="getHeaderClass(etat)">
      {{ etat }}
    </div>


    <!-- TÂCHES DE LA COLONNE -->
  
    <div class="kanban-card"
     *ngFor="let tache of groupedTaches[etat]"
     [ngClass]="getKanbanCardClass(etat)"
     [class.kanban-card-archived]="tache.archived"
     [class.highlighted-task]="tache.id === highlightedTacheId"
     [attr.id]="'tache-' + tache.id"
     cdkDrag>

      <!-- TITRE -->
      <div class="fw-bold">
        <i [class]="getPriorityIcon(tache.priorite)" class="me-1"></i>
        {{ tache.titre }}
      </div>

      <!-- DATES -->
      <div class="small text-muted">Créée : {{ tache.dateCreation | date: 'yyyy-MM-dd' }}</div>
    


<!-- AVATARS & COMMENTAIRES -->
<div class="d-flex align-items-center mt-2">
  <div class="d-flex">
    <!-- 3 premiers membres -->
    <img *ngFor="let member of getMembres(tache).slice(0, 3)"
         [src]="member.image"
         [title]="member.nom + ' ' + member.prenom"
         class="avatar me-1" />

    <!-- +X si plus de 3 -->
    <div *ngIf="getMembres(tache).length > 3"
         class="avatar-plus me-1"
         (click)="openExtraMembersModal(tache)">
      +{{ getMembres(tache).length - 3 }}
    </div>
  </div>

  <!-- bouton commentaires -->
  <button class="btn btn-chat" style="margin-left: 2px;" (click)="openCommentairesModal(tache.id!)">
    <i class="fas fa-comments"></i>
  </button>
</div>


    </div>


  </div>
</div>



   

    <div *ngIf="!loading && filteredTaches.length === 0" class="alert alert-info text-center">
      Aucune tâche trouvée pour ce projet.
    </div>
  </div>
</div>
