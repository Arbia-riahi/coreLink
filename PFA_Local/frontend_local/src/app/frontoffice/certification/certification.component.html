<section class="site-section border-bottom" id="certification-section">
  <div class="container-fluid p-0">
    <div class="text-center mb-5">
      <h2 class="section-title mb-3" data-aos="fade-up">Nos Certifications</h2>
      <p class="lead" data-aos="fade-up" data-aos-delay="100">
        Découvrez nos certifications reconnues, gage de qualité et d'expertise.
      </p>
    </div>

    <div id="certificationCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">

        <!-- Générer les slides -->
        <div *ngFor="let group of certificationGroups; let i = index" class="carousel-item" [class.active]="i === 0">
          <div class="row text-center">
            <div class="col-md-3" *ngFor="let cert of group">
              <div class="cert-card p-3">
                <img [src]="getLogoUrl(cert.logo)" class="img-fluid mb-2" [alt]="cert.nom" style="max-height: 120px;">
                <h5>{{ cert.nom }}</h5>
                <p class="text-muted">{{ cert.description }}</p>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#certificationCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#certificationCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
</section>
